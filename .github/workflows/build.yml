name: Build FactureSimple APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        run: |
          curl -L "https://github.com/merzakmarwan-jpg/Facture-simple/raw/main/.github/workflows/FactureSimple_COMPLETE_v1.zip" -o project.zip
      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

          echo "===== PROJECT FILES ====="
          find project -maxdepth 4 -type f | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FactureSimple-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
