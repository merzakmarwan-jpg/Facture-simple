name: Build FactureSimple APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP from repository
        run: |
          curl -L \
            "https://github.com/merzakmarwan-jpg/Facture-simple/raw/main/FactureSimple_Source_Ready.zip" \
            -o project.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -q project.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FactureSimple-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
