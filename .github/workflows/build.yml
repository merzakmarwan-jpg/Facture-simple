name: Build MGE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare MGE project
        run: |
          set -e

          ZIP_FILE=".github/workflows/FactureSimple_FIXED_JVM17_v2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: MGE project ZIP not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "Available ZIP files:"
            find .github/workflows -maxdepth 1 -type f -name "*.zip" -ls
            exit 1
          fi

          echo "MGE ZIP found:"
          ls -lh "$ZIP_FILE"

          echo "Testing ZIP..."
          unzip -t "$ZIP_FILE"

          rm -rf project
          mkdir -p project

          echo "Extracting MGE project..."
          unzip -q "$ZIP_FILE" -d project

          echo "===== PROJECT FILES ====="
          find project -maxdepth 5 -type f | sort

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Prepare Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f -path "*/bin/sdkmanager" \
              | sort -V | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f -ls || true
            exit 1
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Installing required Android SDK packages..."
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_SDK_ROOT"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "===== BUILD MGE APK ====="
          gradle clean assembleDebug --stacktrace

      - name: Show APK
        run: |
          echo "===== APK FILES ====="
          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGE-3.9.7.52-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
