      # ==========================================
      # 7. نشر Firebase Functions
      # ==========================================
      - name: Deploy Firebase Functions
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e

          echo "===== Checking Firebase project ====="

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi

          echo "Firebase service account secret found."

          # إنشاء ملف Service Account مؤقت
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json

          # التحقق من JSON
          node -e "JSON.parse(require('fs').readFileSync('firebase-service-account.json', 'utf8')); console.log('Firebase JSON is valid.')"

          # استخدام Service Account
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/firebase-service-account.json"

          # تثبيت Firebase CLI
          npm install -g firebase-tools

          echo "===== Node.js ====="
          node --version

          echo "===== Firebase CLI ====="
          firebase --version

          echo "===== Firebase configuration ====="

          if [ ! -f "firebase.json" ]; then
            echo "ERROR: firebase.json not found."
            echo "Searching:"
            find "$PWD" -maxdepth 4 -name "firebase.json" -print
            exit 1
          fi

          cat firebase.json

          echo "===== Deploying Firebase Functions ====="

          firebase deploy \
            --only functions \
            --project facturesimple-1b613

          # حذف المفتاح
          rm -f firebase-service-account.json

          echo "Firebase Functions deployment completed."
